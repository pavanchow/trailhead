<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Trailhead logo">
  <!-- winding trail leading to the head -->
  <path d="M28 108 C 44 92, 30 74, 52 62 C 74 50, 60 40, 82 30" fill="none"
        stroke="#0f7a5c" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 15"/>
  <!-- marker post at the trail head -->
  <rect x="82" y="20" width="7" height="64" rx="3.5" fill="#0f7a5c"/>
  <!-- blaze flag -->
  <path d="M89 22 H116 L106 33 L116 44 H89 Z" fill="#4fcf9f" stroke="#0f7a5c" stroke-width="3" stroke-linejoin="round"/>
  <!-- start point -->
  <circle cx="28" cy="108" r="8" fill="#0f7a5c"/>
</svg>
